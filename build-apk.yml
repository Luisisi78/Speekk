name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Añadir motor y modelo de voz offline (Vosk)
        run: |
          cp node_modules/vosk-browser/dist/vosk.js www/vosk.js
          mkdir -p www/models
          curl -fL --retry 3 -o www/models/vosk-model-small-en-us-0.15.tar.gz \
            https://ccoreilly.github.io/vosk-browser/models/vosk-model-small-en-us-0.15.tar.gz \
            || echo "::warning::No se pudo descargar el modelo offline; la app usará solo el motor online"

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Permisos de micrófono
        run: python3 scripts/patch_manifest.py

      - name: Sincronizar web con Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ReadAloud-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
